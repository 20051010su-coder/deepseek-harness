name: Build Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop-community/**'
      - '.github/workflows/desktop-windows.yml'
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare isolated desktop build
        shell: pwsh
        run: |
          $buildDir = Join-Path '${{ runner.temp }}' 'dsh-desktop-community'
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          Copy-Item -Path 'apps/desktop-community/*' -Destination $buildDir -Recurse -Force
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/dsh-desktop-community
        run: npm install
      - name: Install complete DSH production runtime
        working-directory: ${{ runner.temp }}/dsh-desktop-community/runtime
        run: npm install --omit=dev
      - name: Patch Windows directory picker
        working-directory: ${{ runner.temp }}/dsh-desktop-community
        run: node desktop/patch-runtime.cjs
      - name: Run smoke test
        working-directory: ${{ runner.temp }}/dsh-desktop-community
        run: npm run test:smoke
      - name: Verify installed DSH runtime
        working-directory: ${{ runner.temp }}/dsh-desktop-community
        run: npm run test:runtime
      - name: Build Windows installer
        working-directory: ${{ runner.temp }}/dsh-desktop-community
        run: npm run dist:win
      - name: Verify packaged DSH runtime
        shell: pwsh
        run: |
          $unpacked = Join-Path '${{ runner.temp }}' 'dsh-desktop-community/dist/win-unpacked'
          $runtime = Join-Path $unpacked 'resources/runtime/node_modules/@deepseek-ai/dsh/package.json'
          if (-not (Test-Path -LiteralPath $runtime)) {
            throw "Packaged DSH runtime is missing: $runtime"
          }
          $electron = Join-Path $unpacked 'DSH Desktop Community.exe'
          $entry = Join-Path $unpacked 'resources/runtime/node_modules/@deepseek-ai/dsh/lib/bin.js'
          $test = Join-Path '${{ runner.temp }}' 'dsh-desktop-community/desktop/runtime-server-test.cjs'
          node $test --electron --executable $electron --entry $entry
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-community-windows-x64
          path: |
            ${{ runner.temp }}/dsh-desktop-community/dist/*.exe
            ${{ runner.temp }}/dsh-desktop-community/dist/*.blockmap
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            ${{ runner.temp }}/dsh-desktop-community/dist/*.exe
            ${{ runner.temp }}/dsh-desktop-community/dist/*.blockmap
